name: Dev CI

on:
  push:
    branches:
      - dev

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: |
          pip install -r requirements.txt
          pip install databricks-cli

      - run: pytest

      - run: databricks bundle validate